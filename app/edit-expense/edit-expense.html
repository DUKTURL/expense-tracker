<div class="container mt-4 w-50">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3 text-center">Edit Expense</h4>

      <p>The expense id is {{ expense?.id }} and amount is {{ expense?.amount }}</p>

      <!-- TITLE -->
      <div class="mb-3">
        <label class="form-label">Expense Title</label>
        <input type="text" class="form-control" [(ngModel)]="editTitle" />
      </div>

      <!-- AMOUNT -->
      <div class="mb-3">
        <label class="form-label">Amount ($)</label>
        <input type="number" class="form-control" [(ngModel)]="editAmount" />
      </div>

      <!-- CATEGORY -->
      <div class="mb-3">
        <label class="form-label">Category</label>
        <select class="form-select" [(ngModel)]="editCategory">
          <option value="" disabled>Select category</option>
          <option value="School">School</option>
          <option value="Personal">Personal</option>
          <option value="Grocery">Grocery</option>
          <option value="Utilities">Utilities</option>
          <option value="Shopping">Shopping</option>
          <option value="Travel">Travel</option>
        </select>
      </div>

      <!-- BUTTON -->
      <div class="d-grid">
        <button class="btn btn-primary" (click)="saveExpense()">Edit Expense</button>
      </div>
    </div>
  </div>
</div>
