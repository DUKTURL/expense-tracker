<div class="card mb-2 shadow-sm mb-3">
  <div class="card-body d-flex justify-content-between align-items-center">
    <div>
      <h5 class="mb-1">{{ expense.title }}</h5>
      <small class="fw-semibold" style="color: purple">{{ expense.category }}</small>
    </div>

    <div class="text-end">
      <div class="fw-bold text-success">${{ expense.amount }}</div>
      <button class="btn btn-primary btn-sm m-2" (click)="editExpense()">Edit</button>

      <button class="btn btn-danger btn-sm m-2" (click)="deleteExpense()">Delete</button>
    </div>
  </div>
</div>
