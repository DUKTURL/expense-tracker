<div class="container mt-4">
  <h2 class="text-center mb-4">All Expenses</h2>

  @for (item of items; track item.id) {
    <app-expense-item [expense]="item"></app-expense-item>
  } @empty {
    <div class="alert alert-info text-center">No expenses available. Please add a new expense.</div>
  }
</div>
